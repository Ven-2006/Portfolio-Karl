<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reptile Gallery</title>

    <link rel="stylesheet" href="../GALLERY/Gallery.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <header>
        <h1>Reptile Gallery</h1>
        <p>Witness the beauty of nature's most fascinating reptiles.</p>
    </header>

    <section class="gallery">

        <figure class="card">
            <a href="#viper">
                <img src="../GALLERY/PICS/viper.jpg" alt="Viper">
                <figcaption>Viper</figcaption>
            </a>
        </figure>

        <figure class="card">
            <a href="#python">
                <img src="../GALLERY/PICS/python.jpg" alt="Python">
                <figcaption>Python</figcaption>
            </a>
        </figure>

        <figure class="card">
            <a href="#chameleon">
                <img src="../GALLERY/PICS/chamelon.jfif" alt="Chameleon">
                <figcaption>Chameleon</figcaption>
            </a>
        </figure>

        <figure class="card">
            <a href="#crocodile">
                <img src="../GALLERY/PICS/crocodile.jfif" alt="Crocodile">
                <figcaption>Crocodile</figcaption>
            </a>
        </figure>

        <figure class="card">
            <a href="#dragon">
                <img src="../GALLERY/PICS/dragon.jpg" alt="Bearded Dragon">
                <figcaption>Bearded Dragon</figcaption>
            </a>
        </figure>

        <figure class="card">
            <a href="#komodo">
                <img src="../GALLERY/PICS/komodo.jfif" alt="Komodo Dragon">
                <figcaption>Komodo Dragon</figcaption>
            </a>
        </figure>

        <figure class="card">
            <a href="#mamba">
                <img src="../GALLERY/PICS/mamba.jpg" alt="Black Mamba">
                <figcaption>Black Mamba</figcaption>
            </a>
        </figure>

        <figure class="card">
            <a href="#gecko">
                <img src="../GALLERY/PICS/geecko.jfif" alt="Gecko">
                <figcaption>Gecko</figcaption>
            </a>
        </figure>

        <figure class="card">
            <a href="#basilisk">
                <img src="../GALLERY/PICS/bas.jfif" alt="Basilisk">
                <figcaption>Basilisk</figcaption>
            </a>
        </figure>

    </section>

</div>



<div id="viper" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="../GALLERY/PICS/viper.jpg" >
</div>

<div id="python" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="../GALLERY/PICS/python.jpg">
</div>

<div id="chameleon" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="../GALLERY/PICS/chamelon.jfif">
</div>

<div id="crocodile" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="../GALLERY/PICS/crocodile.jfif">
</div>

<div id="dragon" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="../GALLERY/PICS/dragon.jpg" >
</div>

<div id="komodo" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="../GALLERY/PICS/komodo.jfif">
</div>

<div id="mamba" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="../GALLERY/PICS/mamba.jpg" >
</div>

<div id="gecko" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="../GALLERY/PICS/geecko.jfif">
</div>

<div id="basilisk" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="../GALLERY/PICS/bas.jfif">
</div>

</body>
</html>
